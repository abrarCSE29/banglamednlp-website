version: '3.8'
services:
  mailhog:
    image: mailhog/mailhog
    ports:
      - '1025:1025' # SMTP port
      - '8025:8025' # Web UI port

  # Note: backend and frontend are omitted for simple local dev, just run `npm run dev` for those.
  # The database is hosted on Supabase and configured via the DATABASE_URL environment variable.
